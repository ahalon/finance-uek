{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Asset - Finance Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="mb-3">
            <a href="{% url 'asset_list' %}" class="text-decoration-none text-muted small">
                &larr; Back to assets
            </a>
        </div>
        <div class="card shadow-sm border-0 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold mb-1">Edit Asset</h4>
                    <p class="text-muted small mb-0">
                        Update details for instrument <strong>{{ asset.ticker }}</strong>
                    </p>
                </div>
                <span class="badge bg-secondary fs-6">
                    {{ asset.currency }}
                </span>
            </div>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                    <a href="{% url 'asset_list' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-primary px-4">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
